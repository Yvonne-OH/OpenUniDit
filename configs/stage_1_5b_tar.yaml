# Giga-Exp Image stage_1 5B — attention 加重型 (NFS unified tar 数据版)。
# 参考 configs/stage_1_xl_tar.yaml (数据/调度/组件完全一致), 唯一区别是模型结构。
#
# 设计目标: attn (QKV+out) ~2.5B (~37%), FFN 膨胀比压到 3.0 (新一代生图模型窄 FFN 风格:
# Qwen-Image-2.1 mlp_ratio=3 / MOSS-Image 2.67, 上一代 DiT/SD3/FLUX/Qwen v1 均为 4.0)。
# DiT 的核心算子是跨 1024 image token + 2048 text token 的全局混合, FFN 只是逐 token 变换,
# attn:ffn 比例上调有明确动机; 但低于 3x 无生图侧实证, 不再激进。
#   dim=3840, layers=36, ffn_dim=11520 (ratio 3.0):
#     attn  2.12B (37.0%)   qkv+out: 4·3840²·36 (no bias)
#     FFN   3.18B (55.5%)   2·3840·11520·36 (ratio 3.0)  → attn:ffn ≈ 1:1.5 (= Qwen-Image-2.1)
#     adaLN 108M (1.9%)     basis r=64 双分支: 共享 P 3840·64 + 每层 mod_img/mod_txt 各 Linear(64, 6·3840)
#     refiner 383M (6.6%)   text_refiner 2 层, 逐项对齐 MOSS _TextBlock: per-head qk RMSNorm +
#                           text 位置 RoPE (与主块同一套 4 轴频率) + SwiGLU 门控 (ffn 11520),
#                           每层 4·3840²+3·3840·11520 ≈ 192M, 残差支路零初始化 (恒等起步)
#     head/emb ~26M (0.4%)  text_in 2560→3840, time_in 256→3840→3840, patch_in/out,
#                           head_mod (MOSS-Image 风格 shift+scale final adaLN, r=64 时 0.5M)
#   合计 ≈ 5.83B, bf16 ≈ 11.7GB。
# 其余按惯例: heads=30 → head_dim 128, 与 rope_axes_dims [16,48,48,16] (合计 128) 严格对齐;
# depth 36 邻近 Qwen-Image-2.1 (32 层) 区间; dim 缩至 3840 (Z-Image 同款) 控总参 ≤6B,
# b=2 → b=1 + grad_accum 2 (有效 batch 与 XL 一致), 256 桶 b 4→2。
# 文本条件: Qwen chat 模板 (use_chat_template: true, 对齐 MOSS-Image / 6B teacher 约定),
# 从零训练 step0 起即固定, 推理 infer_giga_exp.py 读同一键自动同步。
stage: stage_1
output_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_5b
seed: 42

# DeepSpeed launcher: deepspeed --num_gpus=8 train_giga_exp.py --config configs/stage_1_5b_tar.yaml
distributed:
  backend: deepspeed
  config: configs/zero1.json
  world_size: 8
  timeout_seconds: 14400  # 首次索引构建(33源+741万 t2i 行全量扫 NFS)可超 2h, 4h 兜底

model:
  # AdaLN 结构 (adaln_type: shared | dual | basis): basis 低秩调制沿 XL 验证配置不变,
  # dim 翻倍后全秩 adaLN 会到 ~1.6B, basis r=64 只 94M。
  adaln_type: basis
  adaln_rank: 64
  # Text Refiner (MOSS-Image 风格, 2 层恒等初始化) 沿 XL 验证配置; dim 4096 下占 403M (~8%)。
  text_trans:
    enabled: true
    layers: 2
    heads: 30
  in_channels: 48
  out_channels: 48
  text_dim: 2560
  dim: 3840
  ffn_dim: 11520        # MLP ratio 3.0 (Qwen-Image-2.1 mlp_ratio=3, 新一代窄 FFN 下限)
  heads: 30
  layers: 36
  rope_theta: 10000.0
  # 4D RoPE: (time, height, width, text_position), head_dim = dim/heads = 128, 不变
  rope_axes_dims: [16, 48, 48, 16]
  patch_size: [1, 1, 1]

components:
  text_encoder:
    type: qwen3_vl
    pretrained_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    tokenizer_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    local_files_only: true
    layer: -2
    max_length: 2048
    # Qwen chat 模板 (对齐 MOSS-Image / 6B teacher 约定): prompt 包成单条 user 消息 +
    # add_generation_prompt (enable_thinking=True); CFG 空分支 (eos) 同样走模板保持两分支一致。
    # 从零训练 step0 起即固定模板约定; 训练与推理必须同时开关 (infer_giga_exp.py 读同一键)。
    use_chat_template: true
  wan_vae:
    type: AutoencoderKLWan
    pretrained_path: /mnt/nfs/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    subfolder: vae
    local_files_only: true

scheduler:
  type: flow_matching
  num_train_timesteps: 1000
  shift: 3.0
  timestep_sampling: uniform
  validation_shift: 3.0

dataset:
  # ── 数据后端: NFS unified tar 分片, 与 XL tar 版完全一致 (含 edit 库 t2i_caption 7 源) ──
  dataset_type: tar_parquet
  image_training_enabled: true
  edit_training_enabled: false
  database_path: /mnt/nfs/data/zhanqian.wu/unified_images_tar
  image_sources:
    - 4KLSDB
    - Aesthetic-4K
    - HumanCaption-10M
    - LAION_Aesthetics_1024
    - Poster100K
    - anime_captions
    - bg_photo_concepts
    - blip3o-long-caption-wds
    - blip3o-long-caption
    - caption3o-xl-v4
    - ffhq_captioned_1024
    - fine_t2i
    - pexels-advertisement-photography
    - pexels_aesth_2_1024
    - qwen-synth-characters-fused
    - sa1b_en
    - anyword_3m
    - pixelprose_cc12m
    - pixelprose_commonpool
    - pixelprose_redcaps
    - monet_cc12m
    - monet_commoncatalog_cc_by
    - monet_coyo
    - GenPoster100K
    - Text-Render-2M
    - moss_synth_sa1b_10h
    - FLUX-Reason-6M
    - JourneyDB
    - moss_synth
    - moss_synth_eval100k
    - h3image_synth_webcap_10h
    - moss_synth_300k_48h
  # edit 库 7 个单图对源的 t2i_caption 模式: before 原图 + Qwen3-VL 描述 caption 作普通
  # image 样本 (~741 万行); parquet_t2i 由 tools/build_tar_parquet_t2i.py 生成。
  t2i_edit_database_path: /mnt/nfs/data/zhanqian.wu/unified_edit_images_tar
  t2i_edit_sources_t2i_mode:
    - HQ-Edit
    - GPT-UltraEdit
    - GPT-HQEdit
    - pico-banana-400k
    - GPT-OmniEdit
    - CrispEdit
    - SEED-Data-Edit
  contract: "[B,C,T,H,W]"
  num_frames: 1
  preprocess_style: cover
  resolution: 512
  long_edge: 512
  max_upscale_ratio: 1.2
  max_retries: 16
  refresh_index_cache: false
  index_cache_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_5b/dataset_index_cache
  buckets:
    - 256_square
    - 256x192
    - 192x256
    - 512_square
    - 512x384
    - 384x512
  bucket_sampling_weights:
    256_square: 0.14
    256x192: 0.08
    192x256: 0.08
    512_square: 0.315
    512x384: 0.1925
    384x512: 0.1925
  # dim 2048→4096 后文本/图像激活翻倍: 256 桶 b=2 (4×2048 text token x 2x dim OOM 风险),
  # 全局有效 batch 靠 grad_accum 2 补回 (与 XL b=2 等价)
  bucket_batch_sizes:
    256_square: 2
    256x192: 2
    192x256: 2

validation:
  enabled: true
  every_n_steps: 1000
  per_rank: true
  use_next_batch: true
  num_inference_steps: 20
  seed: 42
  guidance_scale: 3.0

training:
  enabled: true
  t2v_only: true
  cfg_dropout: 0.1
  # dim 4096: 激活 ~2x, b=2 打不满 (XL b=2 已 ~78GB), 降为 b=1 + grad_accum=2
  # (有效 batch = 8 卡 x 1 x 2 与 XL 8 卡 x 2 x 1 一致)
  batch_size_per_device: 1
  num_workers: 8
  max_epochs: 2
  mixed_precision: bf16
  optimizer: adamw
  torch_compile: false
  muon:
    enabled: false
    momentum: 0.95
    learning_rate: 3x
    adjust_lr_fn: match_rms_adamw
    weight_decay: 0.0
  adam:
    enabled: true
    betas: [0.9, 0.95]
    epsilon: 1.0e-8
    # 必须写在此处: build_optimizer 只读 adam_cfg.get("weight_decay"), 顶层 weight_decay 不会被读取
    weight_decay: 0.005
  # 从零训练: lr 按 1/sqrt(width) 从 XL (dim 2048, 5e-5) 下调至 3.5e-5, warmup 相应拉长
  learning_rate: 3.5e-5
  weight_decay: 0.005
  lr_scheduler: cosine
  lr_warmup_steps: 1500
  gradient_accumulation_steps: 2
  checkpointing_steps: 5000
  state_checkpoints_keep: 1
  # 全新结构从零训练, 不继承任何权重
  resume_mode: auto
  resume_optimizer: false
  resume_lr_scheduler: true

logging:
  report_to: [console, swanlab]
  log_every_n_steps: 1
  save_samples: true
  swanlab:
    enabled: true
    project: giga-exp-image
    name: giga_exp_image_stage_1_5b_1122
    api_key: Dit2ngq8iuiGfUkI88e5b
  wandb:
    enabled: false
    project: giga-exp-image
    name: giga_exp_image_stage_1_5b_1122
