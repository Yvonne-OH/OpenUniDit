# Giga-Exp Image stage_1 5B — attention 加重型 (NFS unified tar 数据版)。
# 参考 configs/stage_1_xl_tar.yaml (数据/调度/组件完全一致), 唯一区别是模型结构。
#
# 设计目标: 总参 ~5B, attention (QKV+out) ~2B (~40%)。
# XL (dim 2048, ratio 4) 的 attn:ffn = 4d² : 8d² = 1:2, attn 只占 ~32%。
# 提到 40% 的合理路径不是拉宽, 而是降低 MLP ratio (Gemma-2 ratio 2.0 / Phi-3-medium ratio 3.0
# 的宽注意力窄 FFN 设计): DiT 的核心算子是跨 1024 image token + 2048 text token 的全局混合,
# FFN 只是逐 token 变换, attn:ffn 比例上调有明确动机。
#   4d²·L = 2B 且 ffn = 2.5d → dim=4096, layers=30, ffn_dim=10240:
#     attn  2.01B (39.7%)   qkv+out: 4·4096²·30
#     FFN   2.52B (49.6%)   2·4096·10240·30 (ratio 2.5)
#     adaLN 94M  (1.9%)     basis r=64: 共享 P 4096·64 + 每层 2×Linear(64, 6·4096)
#     refiner 403M (7.9%)   text_refiner 2 层 (每层 12·4096², MOSS 风格恒等初始化)
#     embed/out ~45M (0.9%) text_in 2560→4096, time_in 256→4096→4096, patch_in/out
#   合计 ≈ 5.07B, bf16 ≈ 10.1GB。
# 其余按惯例: heads=32 → head_dim 128, 与 rope_axes_dims [16,48,48,16] (合计 128) 严格对齐;
# depth 30 在 SD3-Large (32 层/8B) 区间; dim 翻倍 → 显存激活 ~2x, b=2 → b=1 + grad_accum 2
# (有效 batch 与 XL 一致), 256 桶 b 4→2。
stage: stage_1
output_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_5b
seed: 42

# DeepSpeed launcher: deepspeed --num_gpus=8 train_giga_exp.py --config configs/stage_1_5b_tar.yaml
distributed:
  backend: deepspeed
  config: configs/zero1.json
  world_size: 8
  timeout_seconds: 7200

model:
  # AdaLN 结构 (adaln_type: shared | dual | basis): basis 低秩调制沿 XL 验证配置不变,
  # dim 翻倍后全秩 adaLN 会到 ~1.6B, basis r=64 只 94M。
  adaln_type: basis
  adaln_rank: 64
  # Text Refiner (MOSS-Image 风格, 2 层恒等初始化) 沿 XL 验证配置; dim 4096 下占 403M (~8%)。
  text_trans:
    enabled: true
    layers: 2
    heads: 32
  in_channels: 48
  out_channels: 48
  text_dim: 2560
  dim: 4096
  ffn_dim: 10240        # MLP ratio 2.5 (Gemma-2/Phi-3 风格宽注意力窄 FFN)
  heads: 32
  layers: 36
  rope_theta: 10000.0
  # 4D RoPE: (time, height, width, text_position), head_dim = dim/heads = 128, 不变
  rope_axes_dims: [16, 48, 48, 16]
  patch_size: [1, 1, 1]

components:
  text_encoder:
    type: qwen3_vl
    pretrained_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    tokenizer_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    local_files_only: true
    layer: -2
    max_length: 2048
  wan_vae:
    type: AutoencoderKLWan
    pretrained_path: /mnt/nfs/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    subfolder: vae
    local_files_only: true

scheduler:
  type: flow_matching
  num_train_timesteps: 1000
  shift: 3.0
  timestep_sampling: uniform
  validation_shift: 3.0

dataset:
  # ── 数据后端: NFS unified tar 分片, 与 XL tar 版完全一致 (含 edit 库 t2i_caption 7 源) ──
  dataset_type: tar_parquet
  image_training_enabled: true
  edit_training_enabled: false
  database_path: /mnt/nfs/data/zhanqian.wu/unified_images_tar
  image_sources:
    - 4KLSDB
    - Aesthetic-4K
    - HumanCaption-10M
    - LAION_Aesthetics_1024
    - Poster100K
    - anime_captions
    - bg_photo_concepts
    - blip3o-long-caption-wds
    - blip3o-long-caption
    - caption3o-xl-v4
    - ffhq_captioned_1024
    - fine_t2i
    - pexels-advertisement-photography
    - pexels_aesth_2_1024
    - qwen-synth-characters-fused
    - sa1b_en
    - anyword_3m
    - pixelprose_cc12m
    - pixelprose_commonpool
    - pixelprose_redcaps
    - monet_cc12m
    - monet_commoncatalog_cc_by
    - monet_coyo
    - GenPoster100K
    - Text-Render-2M
    - moss_synth_sa1b_10h
    - FLUX-Reason-6M
    - JourneyDB
    - moss_synth
    - moss_synth_eval100k
    - h3image_synth_webcap_10h
    - moss_synth_300k_48h
  # edit 库 7 个单图对源的 t2i_caption 模式: before 原图 + Qwen3-VL 描述 caption 作普通
  # image 样本 (~741 万行); parquet_t2i 由 tools/build_tar_parquet_t2i.py 生成。
  t2i_edit_database_path: /mnt/nfs/data/zhanqian.wu/unified_edit_images_tar
  t2i_edit_sources_t2i_mode:
    - HQ-Edit
    - GPT-UltraEdit
    - GPT-HQEdit
    - pico-banana-400k
    - GPT-OmniEdit
    - CrispEdit
    - SEED-Data-Edit
  contract: "[B,C,T,H,W]"
  num_frames: 1
  preprocess_style: cover
  resolution: 512
  long_edge: 512
  max_upscale_ratio: 1.2
  max_retries: 16
  refresh_index_cache: false
  index_cache_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_5b/dataset_index_cache
  buckets:
    - 256_square
    - 256x192
    - 192x256
    - 512_square
    - 512x384
    - 384x512
  bucket_sampling_weights:
    256_square: 0.14
    256x192: 0.08
    192x256: 0.08
    512_square: 0.315
    512x384: 0.1925
    384x512: 0.1925
  # dim 2048→4096 后文本/图像激活翻倍: 256 桶 b=2 (4×2048 text token x 2x dim OOM 风险),
  # 全局有效 batch 靠 grad_accum 2 补回 (与 XL b=2 等价)
  bucket_batch_sizes:
    256_square: 2
    256x192: 2
    192x256: 2

validation:
  enabled: true
  every_n_steps: 1000
  per_rank: true
  use_next_batch: true
  num_inference_steps: 20
  seed: 42
  guidance_scale: 3.0

training:
  enabled: true
  t2v_only: true
  cfg_dropout: 0.1
  # dim 4096: 激活 ~2x, b=2 打不满 (XL b=2 已 ~78GB), 降为 b=1 + grad_accum=2
  # (有效 batch = 8 卡 x 1 x 2 与 XL 8 卡 x 2 x 1 一致)
  batch_size_per_device: 1
  num_workers: 8
  max_epochs: 2
  mixed_precision: bf16
  optimizer: adamw
  torch_compile: false
  muon:
    enabled: false
    momentum: 0.95
    learning_rate: 3x
    adjust_lr_fn: match_rms_adamw
    weight_decay: 0.0
  adam:
    enabled: true
    betas: [0.9, 0.95]
    epsilon: 1.0e-8
  # 从零训练: lr 按 1/sqrt(width) 从 XL (dim 2048, 5e-5) 下调至 3.5e-5, warmup 相应拉长
  learning_rate: 3.5e-5
  weight_decay: 0.005
  lr_scheduler: cosine
  lr_warmup_steps: 1500
  gradient_accumulation_steps: 2
  checkpointing_steps: 5000
  state_checkpoints_keep: 1
  # 全新结构从零训练, 不继承任何权重
  resume_mode: none
  resume_optimizer: false
  resume_lr_scheduler: true

logging:
  report_to: [console, swanlab]
  log_every_n_steps: 1
  save_samples: true
  swanlab:
    enabled: true
    project: giga-exp-image
    name: giga_exp_image_stage_1_5b
    api_key: Dit2ngq8iuiGfUkI88e5b
  wandb:
    enabled: false
    project: giga-exp-image
    name: giga_exp_image_stage_1_5b
