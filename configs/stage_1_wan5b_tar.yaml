# Giga-Exp Image stage_1 Wan5B 单流版 — Wan2.2 TI2V-5B 初始化 + 单流自注意力。
# 结构 (models/wan5b_single_stream.py, 由 tools/convert_wan22_5b.py 从 diffusers
# Wan-AI/Wan2.2-TI2V-5B-Diffusers transformer 转换初始化):
#   - 主干取自 Wan2.2 TI2V-5B DiT (dim 3072 / heads 24 / ffn 14336 / ffn ratio 4.66),
#     去掉每层 cross-attn (attn2, -1.32B); 深度增长到 36 层 + refiner 加深到 8 层 (~5.51B):
#     前 30 层权重来自 Wan 预训练, 新增 6 层主块 ReZero 零初始化 (res_scale=0, step0 恒等,
#     不破坏预训练前向) + 新增 6 层 refiner 恒等初始化 (TextRefinerBlock 原生零初始化输出层);
#   - 单流: 文本 token 经 text_in (Qwen3-VL 2560→3072) + Text Refiner (恒等初始化) 后
#     concat 进主序列, 与 image token 同一自注意力 (stage_1_xl_tar.yaml 单流设计);
#   - 调制保真 Wan: 全局 cond6 = mod_proj(time_in(t)) + 每层 scale_shift_table (非
#     per-block Linear); head 调制取 cond6 前 2 块 + head_table (与 diffusers 一致);
#   - patchify (1,1,1): patch_in/out 由 Wan (1,2,2) conv/proj 权重空间求和转换 (DC 保持);
#   - 4D RoPE 沿用本代码库 SpacetimeRoPE (time,h,w,text_position, axes [16,48,48,16]),
#     Wan RoPE 无参数直接替换; qk norm 为 across-heads RMSNorm(dim) (Wan 原生)。
# 训练: init_from 指向转换权重 (step 0, optimizer 全新); lr 2e-5 (预训练续训, 非从零),
#   warmup 500; 数据后端与 stage_1_xl_tar.yaml 完全一致 (NFS tar + t2i edit 7 源)。
stage: stage_1
output_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_wan5b
seed: 42

# DeepSpeed launcher: deepspeed --num_gpus=8 train_giga_exp.py --config configs/stage_1_wan5b_tar.yaml
distributed:
  backend: deepspeed
  config: configs/zero1.json
  world_size: 8
  timeout_seconds: 7200

model:
  type: wan5b_ss              # 模型分发: GigaExpTransformer (缺省) | wan5b_ss
  adaln_type: shared          # Wan 原生调制结构 (全局 cond6 + per-layer scale_shift_table),
                              # 不使用本库 basis/dual AdaLN; 此键仅供 semantic metadata 记录
  # FLUX.3 Klein 风格 image-only 前置块 (默认 0 不开启): 开启如 2, 在共享块之前对 image token
  # 做模态内自注意力+FFN (文本不参与, 延迟跨模态交互)。恒等初始化 (res_scale=0):
  # 旧 ckpt 无 image_pre_blocks.* 时 step0 前向逐位一致, 续训自动兼容热启动;
  # 关闭时 ckpt 里已有的这些键自动忽略。每块 ~126M (dim3072/ffn14336)。
  image_pre_layers: 0
  text_trans:
    enabled: true
    layers: 8                 # 深度增长: 2 层 Wan 对齐 + 6 层新增 (恒等初始化, step0 不改变前向)
    heads: 24                 # 同主 DiT heads
  in_channels: 48
  out_channels: 48
  text_dim: 2560
  dim: 3072                   # Wan2.2 TI2V-5B
  ffn_dim: 14336
  heads: 24
  layers: 36                  # 30 层预训练 + 6 层新增 (ReZero 零初始化残差)
  pretrained_layers: 30       # 与 Wan2.2 5B ckpt 对应的层数, 之后的新增层 res_scale=0 起步
  rope_theta: 10000.0
  # 4D RoPE: (time, height, width, text_position), head_dim = 128
  rope_axes_dims: [16, 48, 48, 16]
  patch_size: [1, 1, 1]

components:
  text_encoder:
    type: qwen3_vl
    pretrained_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    tokenizer_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    local_files_only: true
    layer: -2                     # 取倒数第二层 hidden states (对齐 gigaworld stage1 约定)
    max_length: 2048
    # Qwen chat 模板开关 (对齐 MOSS-Image / 6B teacher 约定): true 时 prompt 包成单条 user
    # 消息 + add_generation_prompt (enable_thinking=True); CFG 空分支 (eos) 同样走模板保持
    # 两分支一致。训练与推理必须同时开关 (infer_giga_exp.py 读同一键), 只切一侧会文本条件
    # 分布错位。当前 false = 裸文本条件 (与已训 step 对齐); 切 true 需评估 ckpt 适配成本。
    use_chat_template: false
  wan_vae:
    type: AutoencoderKLWan
    pretrained_path: /mnt/nfs/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    subfolder: vae
    local_files_only: true

scheduler:
  type: flow_matching
  num_train_timesteps: 1000
  shift: 3.0
  timestep_sampling: uniform
  validation_shift: 3.0

dataset:
  # ── 数据后端: NFS unified tar 分片, 与 stage_1_xl_tar.yaml 完全一致 ──
  dataset_type: tar_parquet
  image_training_enabled: true
  edit_training_enabled: false
  database_path: /home/jovyan/pfs/data/public/image_data
  image_sources:
    - 4KLSDB
    - Aesthetic-4K
    - HumanCaption-10M
    - LAION_Aesthetics_1024
    - Poster100K
    - anime_captions
    - bg_photo_concepts
    # - blip3o-long-caption-wds  # TODO: PFS 传输未完成, 完成后取消注释
    - blip3o-long-caption
    - caption3o-xl-v4
    - ffhq_captioned_1024
    # - fine_t2i  # TODO: PFS 传输未完成, 完成后取消注释
    - pexels-advertisement-photography
    - pexels_aesth_2_1024
    - qwen-synth-characters-fused
    # - sa1b_en  # TODO: PFS 传输未完成, 完成后取消注释
    - anyword_3m
    - pixelprose_cc12m
    - pixelprose_commonpool
    - pixelprose_redcaps
    - monet_cc12m
    - monet_commoncatalog_cc_by
    - monet_coyo
    - GenPoster100K
    - Text-Render-2M
    - moss_synth_sa1b_10h
    - FLUX-Reason-6M
    # - JourneyDB  # TODO: PFS 传输未完成, 完成后取消注释
    - moss_synth
    - moss_synth_eval100k
    - h3image_synth_webcap_10h
    # - moss_synth_300k_48h  # TODO: PFS 传输未完成, 完成后取消注释
  # edit 库 7 个单图对源的 t2i_caption 模式 (tar 版), before 原图 + Qwen3-VL caption (~741 万行)
  t2i_edit_database_path: /home/jovyan/pfs/data/public/image_data
  t2i_edit_sources_t2i_mode:
    - HQ-Edit
    - GPT-UltraEdit
    # - GPT-HQEdit  # TODO: PFS 传输未完成, 完成后取消注释
    # - pico-banana-400k  # TODO: PFS 传输未完成, 完成后取消注释
    # - GPT-OmniEdit  # TODO: PFS 传输未完成, 完成后取消注释
    # - CrispEdit  # TODO: PFS 传输未完成, 完成后取消注释
    # - SEED-Data-Edit  # TODO: PFS 传输未完成, 完成后取消注释
  contract: "[B,C,T,H,W]"
  num_frames: 1
  preprocess_style: cover
  resolution: 512
  long_edge: 512
  max_upscale_ratio: 1.2
  max_retries: 16
  refresh_index_cache: false
  # 索引缓存独立目录: 指纹与 XL 相同 (同数据同源), 复制 XL 缓存可跳过重建
  index_cache_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_wan5b/dataset_index_cache
  # 256/512 混合分辨率训练: patch(1,1,1) 下 token 数 256px=256, 512px=1024
  buckets:
    - 256_square
    - 256x192
    - 192x256
    - 512_square
    - 512x384
    - 384x512
  bucket_sampling_weights:
    256_square: 0.14
    256x192: 0.08
    192x256: 0.08
    512_square: 0.315
    512x384: 0.1925
    384x512: 0.1925
  # 5B 模型激活高于 XL (3072×30 > 2048×36), 512 桶 b=1 + grad_accum=2, 256 桶 b=2
  bucket_batch_sizes:
    256_square: 2
    256x192: 2
    192x256: 2

validation:
  enabled: true
  every_n_steps: 1000
  per_rank: true
  use_next_batch: true
  num_inference_steps: 20
  seed: 42
  guidance_scale: 3.0

training:
  enabled: true
  t2v_only: true
  cfg_dropout: 0.1
  batch_size_per_device: 1
  # 16 workers: collate 走 numpy 管道不占 /dev/shm (collate_image_batch 设计), 翻倍掩盖 NFS 延迟;
  # 注意每节点 8 rank × 16 worker = 128 解码进程, 需节点 CPU 核数 >= ~160
  num_workers: 16
  max_epochs: 2
  mixed_precision: bf16
  optimizer: adamw
  # dynamic=True + cache_size_limit=64 + L>=2 clamp 已消除 text 长度变化引发的反复重编译;
  # 首次开请观察 TORCH_LOGS=recompiles 确认无中途冷编译 (单 rank 编译会拖死全体 allreduce)
  torch_compile: false
  muon:
    enabled: false
    momentum: 0.95
    learning_rate: 3x
    adjust_lr_fn: match_rms_adamw
    weight_decay: 0.0
  adam:
    enabled: true
    betas: [0.9, 0.95]
    epsilon: 1.0e-8
  # Wan 预训练续训 (非从零): lr 下调至 2e-5, warmup 缩短
  learning_rate: 8.0e-5
  weight_decay: 0.005
  lr_scheduler: cosine
  lr_warmup_steps: 500
  gradient_accumulation_steps: 2
  checkpointing_steps: 2500
  state_checkpoints_keep: 2
  # Wan2.2 5B 转换权重 SFT 初始化 (step 0, optimizer 全新); 后续断点由 auto 纯权重快照恢复
  init_from: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_wan5b/wan22_5b_init.safetensors
  resume_mode: auto
  resume_optimizer: false
  resume_lr_scheduler: true

logging:
  report_to: [console, swanlab]
  log_every_n_steps: 1
  save_samples: true
  swanlab:
    enabled: true
    project: giga-exp-image
    name: giga_exp_image_stage_1_wan5b
    api_key: Dit2ngq8iuiGfUkI88e5b
  wandb:
    enabled: false
    project: giga-exp-image
    name: giga_exp_image_stage_1_wan5b
