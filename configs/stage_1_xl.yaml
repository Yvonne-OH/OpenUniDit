# Giga-Exp Image stage_1 XL (~2B): 参考 configs/stage_1.yaml, 模型拉大 + patchify 取消。
# 实测参数量 (本地实例化): 总 1.981B ≈ 2B, bf16 ≈ 3.96GB; adaLN (basis r=64) 57.6M。
# 主干: 36 层 x [qkv 3d² + out d² + ff 2·d·8192 + mod 系数头 12·r·d] ≈ 51.9M/层。
# patch_size (1,1,1): 不合并 latent patch, 每 latent 像素 1 token (192 -> 48 输入投影),
#   512px → 1024 image tokens (对照 (1,2,2) 256), token 数 x4, batch 减半对齐显存。
stage: stage_1
output_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_xl
seed: 42

# DeepSpeed launcher: deepspeed --num_gpus=8 train_giga_exp.py --config configs/stage_1_xl.yaml
distributed:
  backend: deepspeed
  config: configs/zero1.json
  world_size: 8
  timeout_seconds: 7200

model:
  # AdaLN 结构 (adaln_type: shared | dual | basis), 旧 shared/dual 全秩 ckpt 加载时自动转换:
  #   basis (默认): 全模型共享 Linear(dim→r) 投影 P + 每层 mod_img/mod_txt 各一个 Linear(r, 6·dim)
  #     系数头。调制只依赖 timestep, 56 条调制曲线在 t 流形上秩 ~32-64, r=64 事后低秩转换
  #     误差 ~3.2% RMS, adaLN 参数 793M→34M (模型 2.95GB→1.43GB bf16)。
  #   dual  : 每层 mod_img/mod_txt 全秩 Linear (MiniMax H3 风格)
  #   shared: 每层一个全序列共用 mod
  adaln_type: basis
  adaln_rank: 64
  # Text Refiner (MOSS-Image 风格): text_in 投影后的文本 token 先过 2 层残差自注意力+FFN 再进主 DiT;
  # 残差支路输出层零初始化 → 初始为恒等映射, step0 与原版逐位一致; 旧 ckpt 无 text_refiner.* 时
  # 自动恒等初始化并给出警告, 平滑增量学习。设为 false 或删除即回到原版直通。
  text_trans:
    enabled: true
    layers: 2        # MOSS 配置 2 层; 消融可先改 1
    heads: 16        # 默认同主 DiT heads
  in_channels: 48
  out_channels: 48
  text_dim: 2560
  dim: 2048
  ffn_dim: 8192
  heads: 16
  layers: 36
  rope_theta: 10000.0
  # 4D RoPE: (time, height, width, text_position), head_dim = 128, 与 dim 解耦不变
  rope_axes_dims: [16, 48, 48, 16]
  patch_size: [1, 1, 1]

components:
  text_encoder:
    type: qwen3_vl
    pretrained_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    tokenizer_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    local_files_only: true
    layer: -2                     # 取倒数第二层 hidden states (对齐 gigaworld stage1 约定)
    max_length: 2048
  wan_vae:
    type: AutoencoderKLWan
    pretrained_path: /mnt/nfs/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    subfolder: vae
    local_files_only: true

scheduler:
  type: flow_matching
  num_train_timesteps: 1000
  shift: 3.0
  timestep_sampling: uniform
  validation_shift: 3.0

dataset:
  dataset_type: lmdb_parquet
  image_training_enabled: true
  edit_training_enabled: false
  database_path: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_database_path: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  lmdb_root: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_root: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_sources:
    - 4KLSDB
    - Aesthetic-4K
    - HumanCaption-10M
    - LAION_Aesthetics_1024
    - Poster100K
    - anime_captions
    - bg_photo_concepts
    - blip3o-long-caption-wds
    - blip3o-long-caption
    - caption3o-xl-v4
    - ffhq_captioned_1024
    - fine_t2i
    - pexels-advertisement-photography
    - pexels_aesth_2_1024
    - qwen-synth-characters-fused
    - sa1b_en
    - anyword_3m
    - pixelprose_cc12m
    - pixelprose_commonpool
    - pixelprose_redcaps
    - monet_cc12m
    - monet_commoncatalog_cc_by
    - monet_coyo
    # 2026-10-31 新增: 数据库已入库但此前未启用白名单的两个源
    # GenPoster100K: 102,651 张海报 (261GB, 96% 短边>=427px 合格 512 桶)
    - GenPoster100K
    # Text-Render-2M: 2,323,502 张文本渲染图 (957GB, 短边已统一 512)。
    # 2026-10-31 曾因 BOS mdb 分片不全 (413/464) 触发分片校验崩溃, 已从 pfs 补传
    # 51 个分片并校验 mdb=464/464 通过。
    - Text-Render-2M
    # 2026-11-02 新增: BOS 扫描发现 8 个完整源 (mdb==parquet 分片数校验通过) 未入白名单。
    # 估算总量 ~190 万; pixelprose 需关注与已有 pixelprose_* 子集的重复, imagenet_1k
    # 2026-11-06 新增: moss_synth_sa1b_10h 合并入库 (56GB, 152 分片, SA-1B 合成图 1024px)
    - moss_synth_sa1b_10h
    # 2026-11-11 新增: 分片校验通过 (mdb==parquet: FLUX 1180/1180, JourneyDB 200/200),
    # mdb 记录含 img_bytes (single 通路), 抽样解码正常。
    # FLUX-Reason-6M: 5,890,279 行 1024px, 长描述 caption (caption/caption_cn/caption_full)
    # JourneyDB: ~419 万行 Midjourney 图 1024px (caption 描述 + caption_full 标签串)
    - FLUX-Reason-6M
    - JourneyDB
    # 2026-11-11 新增: moss/h3image 合成源入库, 分片校验通过 (mdb==parquet), caption 无空值。
    # moss_synth: 4/4 片 512 行; moss_synth_eval100k: 100/100 片 100,000 行 (均 1024px)。
    # h3image_synth_webcap_10h: 由 pfs_data/h3image_synth_webcap_10h 校验后 mv 入库,
    # 180/180 片 33,928 行, 1024x{576,768,1024} 短边>=576 全过 512 桶;
    # mdb 记录 pickle dict (id/source/caption/w/h/img_bytes/source_dataset), 抽样 PNG 解码正常。
    # 注: moss_synth_eval100k_v2 未加入 -- BOS 端即缺 9 个 mdb 分片 (parquet 52/mdb 43),
    # 需从 dg5090 补传后校验再启用。
    - moss_synth
    - moss_synth_eval100k
    - h3image_synth_webcap_10h
    # 2026-11-11 新增: moss_synth_300k_48h 从 BOS 同步入库 (148GB), 校验通过:
    # 1012 文件与 BOS 逐字节大小一致 (缺失0/不一致0), mdb==parquet 506/506 分片 ID 全匹配;
    # 506,000 行全部 1024x1024, caption 无空值, mdb 记录 pickle dict 抽样 JPEG 解码正常。
    - moss_synth_300k_48h
  # 2026-11-11 新增: edit 库 7 个单图对源的 Qwen3-VL 描述 caption (t2i_caption, 非编辑指令)
  # 以 before 原图 + 描述 caption 作为普通 image 样本参与 t2i 训练 (~741 万行, caption 无空值);
  # 读 <root>/<source>/parquet_t2i/, 多参考图源 (unipic_*/Macro-Dataset) 不支持自动跳过。
  # 注意: 新增数据源会改变索引指纹, 首次启动会重建一次索引缓存 (rank0 扫描, 其余 rank 等待)。
  # 2026-11-14 暂时停用 edit 库 7 源 (t2i_caption 图): 减少索引体积与 LMDB 读压力, 需要时恢复
  t2i_edit_database_path: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_edit_images_lmdb
  t2i_edit_sources_t2i_mode:
    - HQ-Edit
    - GPT-UltraEdit
    - GPT-HQEdit
    - pico-banana-400k
    - GPT-OmniEdit
    - CrispEdit
    - SEED-Data-Edit
  contract: "[B,C,T,H,W]"
  num_frames: 1
  preprocess_style: cover   # 短边贴桶+中心裁剪, 无黑边 (实测 resize_long_edge 加权后 37% 样本补黑 >1%)
  resolution: 512
  long_edge: 512
  max_upscale_ratio: 1.2    # 512 桶要求源图短边 >= 427px (抽样: blip3o/fine_t2i/sa1b 等 92~100% 合格, 仅 HumanCaption-10M ~52%)
  max_retries: 16
  refresh_index_cache: false   # 索引指纹不含 buckets, 换桶复用缓存; 桶归属在加载后按 width/height 重算
  index_cache_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_xl/dataset_index_cache
  # 256/512 混合分辨率训练: patch(1,1,1) 下 token 数 256px=256, 512px=1024。
  # 桶归属在加载后按 width/height 重算, 256 桶要求源图短边 >= 213px (max_upscale_ratio 1.2);
  # 同比例高分桶 (512→256) 自动借图降采样, 桶耗尽不回绕重复。
  buckets:
    - 256_square
    - 256x192
    - 192x256
    - 512_square
    - 512x384
    - 384x512
  # 采样权重: 256 组合计 ~30%, 512 组 ~70% (按 512 层内比例分配, 可调)
  bucket_sampling_weights:
    256_square: 0.14
    256x192: 0.08
    192x256: 0.08
    512_square: 0.315
    512x384: 0.1925
    384x512: 0.1925
  # 每桶 per-device batch: 256 桶 batch x4 (16) 与 512 桶 x4 对齐 token 负载 (16*256 = 4*1024)
  bucket_batch_sizes:
    256_square: 16
    256x192: 16
    192x256: 16

validation:
  enabled: true
  every_n_steps: 1000
  per_rank: true
  use_next_batch: true
  num_inference_steps: 20
  seed: 42
  guidance_scale: 3.0

training:
  enabled: true
  t2v_only: true
  cfg_dropout: 0.1
  # patch (1,1,1) 后 image token x4 (512px: 256 -> 1024/token/图), 最长序列 1024+512;
  # batch 减半相对 stage_1 (8 -> 4) 对齐显存。b=4 时显存 ~79GB 打满, 超长文本样本
  # (txt 激活随长度线性涨) 一步即 OOM (2026-11-14 step-320027 实测), 降为 b=2 + grad_accum=2
  # 等效 batch 32 与原先一致
  batch_size_per_device: 2
  num_workers: 4
  max_epochs: 6
  mixed_precision: bf16
  optimizer: adamw
  # 已从 muon+adam 切换回纯 AdamW: hidden 2D 矩阵与 out 头/1D 参数统一走 AdamW (base lr, Muon 3x 系数不再生效)。
  # 注意: 优化器结构变化, 续训时旧 checkpoint 的 optimizer state 不匹配, 会自动降级为纯权重恢复
  # (step 保留, optimizer 状态重置), 日志有 ⚠️ 提示, 属预期行为。
  # 就地编译 DiT (nn.Module.compile, 数学等价): 融合每层 norm/adaLN/RoPE 小 kernel, 缓解 36 层 launch overhead;
  # 前几步为编译 warmup, step 耗时先长后短属正常
  torch_compile: false #true
  muon:
    enabled: false               # 如需切回 muon+adam: enabled 改 true, optimizer 改 muon+adam
    momentum: 0.95
    learning_rate: 3x
    adjust_lr_fn: match_rms_adamw
    weight_decay: 0.0
  adam:
    enabled: true
    betas: [0.9, 0.95]
    epsilon: 1.0e-8
  # XL 从零训练: lr 相对 stage_1 (1e-4) 下调, warmup 拉长适配更大模型
  learning_rate: 5.0e-5
  weight_decay: 0.005
  lr_scheduler: cosine
  lr_warmup_steps: 1000
  gradient_accumulation_steps: 1
  checkpointing_steps: 2500
  state_checkpoints_keep: 2      # DeepSpeed 完整 state 只保留最近 2 个, 纯 weights 快照全部保留
  # auto: 自动恢复 output_dir 下最新 state/weights；none: 不恢复；也可填 .safetensors/.pt 文件或 weights 目录路径，强制从指定纯权重恢复。
  resume_mode: auto   # XL 全新结构, 从零训练 (不继承 stage_1_28layers 权重)
  resume_optimizer: false
  resume_lr_scheduler: true

logging:
  report_to: [console, swanlab]
  log_every_n_steps: 1
  save_samples: true
  swanlab:
    enabled: true
    project: giga-exp-image
    name: giga_exp_image_stage_1_xl
    api_key: Dit2ngq8iuiGfUkI88e5b
  wandb:
    enabled: false
    project: giga-exp-image
    name: giga_exp_image_stage_1_xl
