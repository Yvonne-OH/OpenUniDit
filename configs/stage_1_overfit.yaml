# Giga-Exp Image 过拟合实验: 单一最小数据源 (monet_coyo, 2024 条) + 预训练 ckpt 起步,
# 纯 flow matching (无 KD), 验证训练管线可收敛、模型能记住小数据集 (loss 降到接近 0,
# 验证图逐步复现训练样本)。
# 数据源规模依据 docs/dataset_resolution_prompt_stats.md: stage_1 的 23 个源里
# monet_coyo 最小 (2,024 条; 第二小 blip3o-long-caption 12,189)。
stage: stage_1
output_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_28layers_overfit
seed: 42

distributed:
  backend: deepspeed
  config: configs/zero1.json
  world_size: 8                 # 仅日志展示; 实际以 torchrun 注入为准 (sh 默认 GPUS=8)
  timeout_seconds: 7200

model:
  # dual-branch AdaLN (MiniMax H3 风格): image token 用 mod_img, text token 用 mod_txt;
  # 旧 ckpt 的 blocks.*.mod.* 加载时自动拷贝到两分支 (无损等价热启动, 训练后独立分化)。
  adaln_type: basis   # AdaLN 结构: shared | dual | basis (旧 ckpt 加载时自动低秩转换)
  adaln_rank: 64      # basis 共享基维度
  # Text Refiner (MOSS-Image 风格): text_in 投影后的文本 token 先过 2 层残差自注意力+FFN 再进主 DiT;
  # 残差支路输出层零初始化 → 初始为恒等映射, step0 与原版逐位一致; 旧 ckpt 无 text_refiner.* 时
  # 自动恒等初始化并给出警告, 平滑增量学习。设为 false 或删除即回到原版直通。
  text_trans:
    enabled: true
    layers: 2        # MOSS 配置 2 层; 消融可先改 1
    heads: 12        # 默认同主 DiT heads
  in_channels: 48
  out_channels: 48
  text_dim: 2560
  dim: 1536
  ffn_dim: 4096
  heads: 12
  layers: 28
  rope_theta: 10000.0
  rope_axes_dims: [16, 48, 48, 16]
  # 2026-11-09: (1,2,2) → (1,1,1), 取消空间 patchify 压缩; 旧 (1,2,2) ckpt 的 patch_in/out
  # 不兼容 → 红字警告 + 重新随机初始化, 其余参数正常继承, step 延续。
  patch_size: [1, 1, 1]

components:
  text_encoder:
    type: qwen3_vl
    pretrained_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    tokenizer_path: /mnt/nfs/models/huggingface/Qwen/Qwen3-VL-4B-Instruct
    local_files_only: true
    layer: -2
    max_length: 2048
  wan_vae:
    type: AutoencoderKLWan
    pretrained_path: /mnt/nfs/models/huggingface/models--Wan-AI--Wan2.2-TI2V-5B-Diffusers
    subfolder: vae
    local_files_only: true

scheduler:
  type: flow_matching
  num_train_timesteps: 1000
  shift: 3.0
  timestep_sampling: uniform
  validation_shift: 3.0

dataset:
  dataset_type: lmdb_parquet
  image_training_enabled: true
  edit_training_enabled: false
  database_path: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_database_path: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  lmdb_root: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_root: /home/jovyan/pfs/users/zhanqian.wu/pfs_data/unified_images_lmdb
  image_sources:
    - monet_coyo                # 全库最小源: 2,024 条 (短边中位 686 px)
  contract: "[B,C,T,H,W]"
  num_frames: 1
  preprocess_style: cover
  resolution: 512
  long_edge: 512
  max_upscale_ratio: 1.2
  max_retries: 16
  refresh_index_cache: false
  index_cache_dir: /home/jovyan/pfs/users/zhanqian.wu/exp/giga_exp_image/stage_1_28layers_overfit/dataset_index_cache
  buckets:
    - 512_square
    - 512x384
    - 384x512
  bucket_sampling_weights:
    512_square: 0.45
    512x384: 0.275
    384x512: 0.275

validation:
  enabled: true
  every_n_steps: 250            # 小数据快速过拟合, 高频出可视化看记忆进程
  per_rank: true
  use_next_batch: true
  num_inference_steps: 20
  seed: 42
  guidance_scale: 3.0

training:
  enabled: true
  t2v_only: true
  cfg_dropout: 0.1
  batch_size_per_device: 8
  num_workers: 4
  # 可用样本 ≈ 2024 × ~70% (短边 >= 427 才进 512 桶) ≈ 1400 条;
  # 单卡 batch 8 → ~175 step/epoch, 30 epochs ≈ 5250 步, cosine 收尾。
  # 1.7B 记 1.4k 张图几百步即开始记忆, 30 epochs 足够把 loss 压到接近 0。
  max_epochs: 300000000000000000000000000
  mixed_precision: bf16
  optimizer: adamw
  torch_compile: false
  muon:
    enabled: false
    momentum: 0.95
    learning_rate: 3x
    adjust_lr_fn: match_rms_adamw
    weight_decay: 0.0
  adam:
    enabled: true
    betas: [0.9, 0.95]
    epsilon: 1.0e-8
  learning_rate: 1.0e-4         # 与 stage_1 一致; 若起步 loss 剧烈震荡可降到 2e-5
  weight_decay: 0.0
  lr_scheduler: cosine
  lr_warmup_steps: 100
  gradient_accumulation_steps: 1
  checkpointing_steps: 500
  state_checkpoints_keep: 2
  # 过拟合起点: 232500 步预训练权重 (纯权重恢复, optimizer/scheduler 重置 → cosine 从头走)。
  resume_mode: /home/jovyan/pfs/users/zhanqian.wu/code/model_exp/outputs/bos_ckpt/giga_exp_image/stage_1_28layers/step-00232500.safetensors
  resume_optimizer: false
  resume_lr_scheduler: false

logging:
  report_to: [console, swanlab]
  log_every_n_steps: 1
  save_samples: true
  swanlab:
    enabled: true
    project: giga-exp-image
    name: giga_exp_image_stage_1_28layers_overfit_monet_coyo
    api_key: Dit2ngq8iuiGfUkI88e5b
  wandb:
    enabled: false
    project: giga-exp-image
    name: giga_exp_image_stage_1_28layers_overfit_monet_coyo
